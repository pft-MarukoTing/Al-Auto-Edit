       node at its native 120x120px, which read as soft/blurry once shown
       larger than that, and hand-drawing generic bar/mic shapes didn't match
       Figma's actual artwork closely enough. Positions/rotations here are
       matched by eye against the Figma screenshot since the source uses
       container-query-relative transforms that don't translate 1:1 to a
       static SVG. -->

